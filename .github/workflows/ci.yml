name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Lint and PowerShell wrapper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: hadolint
        run: |
          curl -fsSLo "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile

      - name: shellcheck
        id: shellcheck
        run: |
          {
            curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
              | tar -xJ -C "$RUNNER_TEMP"
            sc="$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck"
            "$sc" --version | sed -n 2p
            "$sc" -s sh scripts/devtools-entrypoint.sh
            "$sc" -s bash devtools.sh setup.sh uninstall.sh \
              scripts/import-docker-desktop-kube.sh scripts/devtools-complete.sh \
              scripts/shell/aliases.sh scripts/shell/az-completion.sh scripts/shell/bashrc \
              tests/*.sh tests/fakebin/docker
          } 2>&1 | tee "$RUNNER_TEMP/shellcheck.log"

      - name: Compose file renders
        run: docker compose config -q

      - name: PowerShell wrapper tests
        id: pwsh
        run: pwsh -NoProfile -File tests/Test-Devtools.ps1 2>&1 | tee "$RUNNER_TEMP/pwsh.log"

      - name: setup.ps1 tests (fake docker)
        id: setup
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File tests/Test-Setup.ps1 2>&1 | tee "$RUNNER_TEMP/setup-tests.log"

      - name: uninstall.ps1 tests (fake docker)
        id: uninstall
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File tests/Test-Uninstall.ps1 2>&1 | tee "$RUNNER_TEMP/uninstall-tests.log"

      - name: PowerShell 7 in a real terminal (Tab menu, completion, history suggestions)
        id: ptypwsh
        if: ${{ !cancelled() }}
        run: python3 tests/pty_shell_test.py pwsh -- pwsh -NoLogo 2>&1 | tee "$RUNNER_TEMP/pty-pwsh.log"

      - name: devtools.sh tests (the bash wrappers, fake docker)
        id: bashwrap
        if: ${{ !cancelled() }}
        run: bash tests/test-devtools-sh.sh 2>&1 | tee "$RUNNER_TEMP/bash-wrap.log"

      - name: setup.sh tests (fake docker)
        id: bashsetup
        if: ${{ !cancelled() }}
        run: bash tests/test-setup-sh.sh 2>&1 | tee "$RUNNER_TEMP/bash-setup-tests.log"

      - name: uninstall.sh tests (fake docker)
        id: bashuninstall
        if: ${{ !cancelled() }}
        run: bash tests/test-uninstall-sh.sh 2>&1 | tee "$RUNNER_TEMP/bash-uninstall-tests.log"

      - name: bash on your machine in a real terminal (Tab completion, history search, -t)
        id: ptyhostbash
        if: ${{ !cancelled() }}
        run: python3 tests/pty_shell_test.py hostbash -- bash 2>&1 | tee "$RUNNER_TEMP/pty-hostbash.log"

      # The scripts promise bash 4.2 or newer (the oldest bash still in use: CentOS 7 / RHEL 7). The
      # official bash images have exactly those versions. Docker Hub is tried last (rate limits).
      - name: The bash tests on bash 4.2 and 4.3 (docker)
        id: oldbash
        if: ${{ !cancelled() }}
        run: |
          {
            for v in 4.2 4.3; do
              img=''
              for base in public.ecr.aws/docker/library mirror.gcr.io/library docker.io/library; do
                if docker pull -q "$base/bash:$v" > /dev/null 2>&1; then img="$base/bash:$v"; break; fi
              done
              if [ -z "$img" ]; then echo "FAIL  could not pull bash:$v from any registry"; exit 1; fi
              for t in test-devtools-sh test-setup-sh test-uninstall-sh; do
                echo "== $t on bash $v"
                docker run --rm -v "$PWD:/src:ro" "$img" bash -c 'cp -a /src /repo && cd /repo && bash "tests/$0.sh"' "$t"
              done
            done
          } 2>&1 | tee "$RUNNER_TEMP/old-bash.log"

      - name: Report results as annotations
        if: always()
        run: |
          tests/ci-annotate.sh "shellcheck" "${{ steps.shellcheck.outcome }}" "$RUNNER_TEMP/shellcheck.log"
          tests/ci-annotate.sh "PowerShell wrapper tests" "${{ steps.pwsh.outcome }}" "$RUNNER_TEMP/pwsh.log" '^(PowerShell|FAIL|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "setup.ps1 tests" "${{ steps.setup.outcome }}" "$RUNNER_TEMP/setup-tests.log" '^(PowerShell|--|FAIL|      |ALL|[0-9]+ SETUP)'
          tests/ci-annotate.sh "uninstall.ps1 tests" "${{ steps.uninstall.outcome }}" "$RUNNER_TEMP/uninstall-tests.log" '^(PowerShell|--|FAIL|SKIP|      |ALL|[0-9]+ UNINSTALL)'
          tests/ci-annotate.sh "PowerShell 7 terminal test" "${{ steps.ptypwsh.outcome }}" "$RUNNER_TEMP/pty-pwsh.log" '^(PASS|FAIL|      |ALL|[0-9]+ SHELL)'
          tests/ci-annotate.sh "devtools.sh tests" "${{ steps.bashwrap.outcome }}" "$RUNNER_TEMP/bash-wrap.log" '^(bash|FAIL|SKIP|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "setup.sh tests" "${{ steps.bashsetup.outcome }}" "$RUNNER_TEMP/bash-setup-tests.log" '^(bash|FAIL|SKIP|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "uninstall.sh tests" "${{ steps.bashuninstall.outcome }}" "$RUNNER_TEMP/bash-uninstall-tests.log" '^(bash|FAIL|SKIP|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "bash terminal test (devtools.sh)" "${{ steps.ptyhostbash.outcome }}" "$RUNNER_TEMP/pty-hostbash.log" '^(PASS|FAIL|      |ALL|[0-9]+ SHELL)'
          tests/ci-annotate.sh "bash tests on bash 4.2 and 4.3" "${{ steps.oldbash.outcome }}" "$RUNNER_TEMP/old-bash.log" '^(==|bash |FAIL|SKIP|      |ALL|[0-9]+ TEST)'

  windows:
    # The wrappers are meant for Windows, where the default shell is Windows PowerShell 5.1.
    # Docker cannot run Linux containers on these runners, so a fake docker.exe records the
    # arguments instead (see tests/fakebin/docker.cs). That still covers what differs on
    # Windows: PowerShell 5.1 syntax, parameter binding, native argument passing, path handling.
    name: PowerShell wrappers on Windows (${{ matrix.ps }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]   # Windows PowerShell 5.1 and PowerShell 7
    steps:
      - uses: actions/checkout@v5

      - name: PowerShell wrapper tests
        id: pwsh
        run: ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tests/Test-Devtools.ps1 2>&1 | tee "$RUNNER_TEMP/pwsh.log"

      - name: setup.ps1 tests (fake docker.exe)
        id: setup
        if: ${{ !cancelled() }}
        run: ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tests/Test-Setup.ps1 2>&1 | tee "$RUNNER_TEMP/setup-tests.log"

      - name: uninstall.ps1 tests (fake docker.exe)
        id: uninstall
        if: ${{ !cancelled() }}
        run: ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tests/Test-Uninstall.ps1 2>&1 | tee "$RUNNER_TEMP/uninstall-tests.log"

      # The bash side, in Git Bash (the shell of these steps), against a docker.exe that is native
      # Windows code. That is what makes Git Bash rewrite /work or /subscriptions/x into a Windows
      # path unless devtools.sh stops it. Once is enough, so only for one of the two PowerShells.
      - name: devtools.sh tests (Git Bash, fake docker.exe)
        id: bashwrap
        if: ${{ !cancelled() && matrix.ps == 'pwsh' }}
        run: bash tests/test-devtools-sh.sh 2>&1 | tee "$RUNNER_TEMP/bash-wrap.log"

      - name: setup.sh tests (Git Bash, fake docker.exe)
        id: bashsetup
        if: ${{ !cancelled() && matrix.ps == 'pwsh' }}
        run: bash tests/test-setup-sh.sh 2>&1 | tee "$RUNNER_TEMP/bash-setup-tests.log"

      - name: uninstall.sh tests (Git Bash, fake docker.exe)
        id: bashuninstall
        if: ${{ !cancelled() && matrix.ps == 'pwsh' }}
        run: bash tests/test-uninstall-sh.sh 2>&1 | tee "$RUNNER_TEMP/bash-uninstall-tests.log"

      - name: Report results as annotations
        if: always()
        run: |
          tests/ci-annotate.sh "devtools.sh tests on Windows (Git Bash)" "${{ steps.bashwrap.outcome }}" "$RUNNER_TEMP/bash-wrap.log" '^(bash|FAIL|SKIP|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "setup.sh tests on Windows (Git Bash)" "${{ steps.bashsetup.outcome }}" "$RUNNER_TEMP/bash-setup-tests.log" '^(bash|FAIL|SKIP|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "uninstall.sh tests on Windows (Git Bash)" "${{ steps.bashuninstall.outcome }}" "$RUNNER_TEMP/bash-uninstall-tests.log" '^(bash|FAIL|SKIP|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "wrapper tests on Windows (${{ matrix.ps }})" "${{ steps.pwsh.outcome }}" "$RUNNER_TEMP/pwsh.log" '^(PowerShell|FAIL|      |ALL|[0-9]+ TEST)'
          tests/ci-annotate.sh "setup.ps1 tests on Windows (${{ matrix.ps }})" "${{ steps.setup.outcome }}" "$RUNNER_TEMP/setup-tests.log" '^(PowerShell|--|FAIL|      |ALL|[0-9]+ SETUP)'
          tests/ci-annotate.sh "uninstall.ps1 tests on Windows (${{ matrix.ps }})" "${{ steps.uninstall.outcome }}" "$RUNNER_TEMP/uninstall-tests.log" '^(PowerShell|--|FAIL|SKIP|      |ALL|[0-9]+ UNINSTALL)'

  image:
    name: Build the image and test it
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        id: build
        run: |
          # Docker Hub often answers the shared GitHub runners with "429 Too Many Requests", so try
          # public mirrors of the same Debian image first and Docker Hub last. The one that worked
          # is kept for the later steps (docker compose, used by setup.ps1, reads BASE_IMAGE too).
          for base in public.ecr.aws/docker/library/debian:bookworm-slim mirror.gcr.io/library/debian:bookworm-slim debian:bookworm-slim; do
            echo "Building on $base"
            if docker build --progress=plain --build-arg "BASE_IMAGE=$base" --tag devtools:ci . 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              echo "BASE_IMAGE=$base" >> "$GITHUB_ENV"
              exit 0
            fi
            # Only a failure to fetch the base image is worth another try; anything else is a real failure.
            grep -qiE 'failed to resolve source metadata|unexpected status from|toomanyrequests|manifest unknown|pull access denied|429 Too Many Requests' "$RUNNER_TEMP/build.log" || exit 1
          done
          exit 1

      - name: Smoke test every tool inside the image
        id: smoke
        run: |
          arg() { sed -n "s/^ARG $1=\(.*\)$/\1/p" Dockerfile | head -n 1; }
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            -e EXPECT_KUBECTL="$(arg KUBECTL_VERSION)" \
            -e EXPECT_KUBELOGIN="$(arg KUBELOGIN_VERSION)" \
            -e EXPECT_HELM="$(arg HELM_VERSION)" \
            -e EXPECT_KUSTOMIZE="$(arg KUSTOMIZE_VERSION)" \
            -e EXPECT_FLUX="$(arg FLUX_VERSION)" \
            -e EXPECT_YQ="$(arg YQ_VERSION)" \
            -e EXPECT_GH="$(arg GH_VERSION)" \
            devtools:ci bash /tests/smoke.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"

      - name: Terminal test, zsh (typing into the image like a person)
        id: ptyzsh
        if: ${{ !cancelled() }}
        run: |
          # dev starts zsh unless told otherwise; docker compose run dev and the dev function rely on it.
          test "$(docker image inspect devtools:ci --format '{{json .Config.Cmd}}')" = '["zsh"]'
          python3 tests/pty_shell_test.py zsh --full -- docker run --rm -it -e TERM=xterm-256color devtools:ci zsh 2>&1 | tee "$RUNNER_TEMP/pty-zsh.log"

      - name: Terminal test, bash
        id: ptybash
        if: ${{ !cancelled() }}
        run: python3 tests/pty_shell_test.py bash --full -- docker run --rm -it -e TERM=xterm-256color devtools:ci bash 2>&1 | tee "$RUNNER_TEMP/pty-bash.log"

      - name: Importer end to end (container reaches a fake API on the host)
        id: e2e
        run: tests/e2e-import.sh devtools:ci 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: One-file setup (setup.ps1 against the real Docker engine)
        id: setup
        run: |
          # The whole README sequence for real: engine check, .env, compose build (cached by the
          # build above), profile, wrappers, then every tool run in its own container.
          profile="$RUNNER_TEMP/profile.ps1"
          pwsh -NoProfile -File setup.ps1 -NoPrompt -ProfilePath "$profile" 2>&1 | tee "$RUNNER_TEMP/setup-real.log"
          test "$(grep -c "^Import-Module '.*Devtools.psm1' -Force$" "$profile")" = 1
          # And again: it must be safe to re-run.
          pwsh -NoProfile -File setup.ps1 -NoPrompt -SkipBuild -SkipVerify -ProfilePath "$profile" 2>&1 | tee -a "$RUNNER_TEMP/setup-real.log"
          test "$(grep -c "^Import-Module '.*Devtools.psm1' -Force$" "$profile")" = 1

      - name: One-file setup, bash (setup.sh against the real Docker engine)
        id: setupsh
        run: |
          # The same sequence from bash: engine check, .env, compose build (cached by the build above),
          # the line for the startup file, the wrappers, every tool in its own container. The home
          # folder is a scratch one, so nothing of the runner's is changed.
          home="$RUNNER_TEMP/bash-home"
          rc="$RUNNER_TEMP/bashrc"
          mkdir -p "$home"
          : > "$rc"
          HOME="$home" ./setup.sh --no-prompt --rc-file "$rc" 2>&1 | tee "$RUNNER_TEMP/setup-sh-real.log"
          test "$(grep -c "^\. '.*devtools.sh'$" "$rc")" = 1
          # And again: it must be safe to re-run.
          HOME="$home" ./setup.sh --no-prompt --skip-build --skip-verify --rc-file "$rc" 2>&1 | tee -a "$RUNNER_TEMP/setup-sh-real.log"
          test "$(grep -c "^\. '.*devtools.sh'$" "$rc")" = 1
          # What a new terminal does with that line: the tools are the container's, for real.
          {
            echo "# a new bash, with the startup file loaded"
            HOME="$home" bash -c '. "$1"; shopt -s expand_aliases
              echo "tools: $(type -t az) $(type -t kubectl) $(type -t terraform) $(type -t dev)"
              eval "tf version" | head -n 1
              eval "k version --client" | head -n 1
              # stdin and the current folder reach the container
              echo "from stdin" | dev bash -c cat
              dev bash -c "test -f /work/devtools.sh && echo the-folder-is-mounted"
              # Tab completion asks the real tools in the container
              comp() { COMP_LINE=$1; COMP_POINT=${#1}; read -ra COMP_WORDS <<< "$1"; COMP_CWORD=$(( ${#COMP_WORDS[@]} - 1 )); _devtools_complete; echo "[$1] -> ${COMPREPLY[*]:0:6}"; }
              comp "kubectl cre"
              comp "terraform ap"
              comp "helm ins"
              comp "kgp --all-nam"
              comp "az acc"
            ' _ "$rc"
          } 2>&1 | tee "$RUNNER_TEMP/bash-real.log"
          grep -q '^tools: function function function function$' "$RUNNER_TEMP/bash-real.log"
          grep -q '^Terraform v' "$RUNNER_TEMP/bash-real.log"
          grep -q 'Client Version' "$RUNNER_TEMP/bash-real.log"
          grep -q '^from stdin$' "$RUNNER_TEMP/bash-real.log"
          grep -q '^the-folder-is-mounted$' "$RUNNER_TEMP/bash-real.log"
          grep -q '^\[kubectl cre\] -> .*create' "$RUNNER_TEMP/bash-real.log"
          grep -q '^\[terraform ap\] -> .*apply' "$RUNNER_TEMP/bash-real.log"
          grep -q '^\[helm ins\] -> .*install' "$RUNNER_TEMP/bash-real.log"
          grep -q '^\[kgp --all-nam\] -> .*--all-namespaces' "$RUNNER_TEMP/bash-real.log"
          grep -q '^\[az acc\] -> .*account' "$RUNNER_TEMP/bash-real.log"

      - name: Uninstall, bash (uninstall.sh against the real Docker engine)
        id: uninstallsh
        run: |
          # A container still running from the image and the line in the startup file; the default
          # run removes both and keeps the image and the logins (uninstall.ps1 below deletes those).
          home="$RUNNER_TEMP/bash-home"
          rc="$RUNNER_TEMP/bashrc"
          log="$RUNNER_TEMP/uninstall-sh-real.log"
          : > "$log"
          note() { echo "# $*" | tee -a "$log"; }
          running() { docker ps -aq --filter ancestor=devtools:latest | wc -l; }
          stray=$(docker ps -aq --filter ancestor=devtools:latest)
          if [ -n "$stray" ]; then
            note "left by earlier steps: $(docker ps -a --filter ancestor=devtools:latest --format '{{.ID}} {{.Image}} {{.Command}} {{.Status}}' | tr '\n' ';')"
            # shellcheck disable=SC2086
            docker rm -f $stray > /dev/null
          fi
          docker run -d --name toolbox-left-running-sh devtools:latest sleep 600
          note "before: $(running) container(s), startup file lines: $(grep -c 'devtools.sh' "$rc" || true)"
          test "$(running)" = 1
          HOME="$home" ./uninstall.sh --no-prompt --rc-file "$rc" 2>&1 | tee -a "$log"
          note "after: $(running) container(s), startup file lines: $(grep -c 'devtools.sh' "$rc" || true), image: $(docker image ls -q devtools:latest | wc -l)"
          test "$(running)" = 0
          test "$(grep -c 'devtools.sh' "$rc" || true)" = 0
          test -n "$(docker image ls -q devtools:latest)"
          docker volume inspect devtools-home > /dev/null
          # Again: a re-run is safe.
          HOME="$home" ./uninstall.sh --no-prompt --rc-file "$rc" 2>&1 | tee -a "$log"

      - name: Uninstall (uninstall.ps1 against the real Docker engine)
        id: uninstall
        run: |
          # The state a real user ends up in: the profile line the step above wrote, a container
          # still running from the image, the volume the wrappers use (the setup step ran every tool
          # through them) and the volume that `docker compose run` creates.
          profile="$RUNNER_TEMP/profile.ps1"
          log="$RUNNER_TEMP/uninstall-real.log"
          : > "$log"
          note() { echo "# $*" | tee -a "$log"; }
          volumes() { docker volume ls --format '{{.Name}}' | grep -E '^devtools(-home|_devtools-home)$' | sort | tr '\n' ' '; }
          running() { docker ps -aq --filter ancestor=devtools:latest | wc -l; }
          # Start from a clean slate: say what an earlier step left behind (the terminal tests start
          # shells in containers), then remove it so the counts below are about this step only.
          stray=$(docker ps -aq --filter ancestor=devtools:latest)
          if [ -n "$stray" ]; then
            note "left by earlier steps: $(docker ps -a --filter ancestor=devtools:latest --format '{{.ID}} {{.Image}} {{.Command}} {{.Status}}' | tr '\n' ';')"
            # shellcheck disable=SC2086
            docker rm -f $stray > /dev/null
          fi
          docker run -d --name toolbox-left-running devtools:latest sleep 600
          docker compose run --rm -T dev true
          note "before: $(running) container(s), volumes: $(volumes), compose network: $(docker network ls --format '{{.Name}}' | grep -c '^devtools_default$' || true)"
          test "$(running)" = 1
          test "$(volumes)" = "devtools-home devtools_devtools-home "

          # Default run: the container and the wrappers go; the image and the logins stay.
          pwsh -NoProfile -File uninstall.ps1 -NoPrompt -ProfilePath "$profile" 2>&1 | tee -a "$log"
          note "after the default run: $(running) container(s), volumes: $(volumes), image: $(docker image ls -q devtools:latest | wc -l), profile lines: $(grep -c 'Devtools.psm1' "$profile" || true), compose network: $(docker network ls --format '{{.Name}}' | grep -c '^devtools_default$' || true)"
          test "$(running)" = 0
          test "$(grep -c 'Devtools.psm1' "$profile" || true)" = 0
          test "$(docker network ls --format '{{.Name}}' | grep -c '^devtools_default$' || true)" = 0
          test -n "$(docker image ls -q devtools:latest)"
          test "$(volumes)" = "devtools-home devtools_devtools-home "

          # Again, now deleting the image and both volumes. Also proves that a re-run is safe.
          pwsh -NoProfile -File uninstall.ps1 -NoPrompt -RemoveImage -RemoveVolume -Force -ProfilePath "$profile" 2>&1 | tee -a "$log"
          note "after -RemoveImage -RemoveVolume: image: $(docker image ls -q devtools:latest | wc -l), volumes: $(volumes)"
          test -z "$(docker image ls -q devtools:latest)"
          test -z "$(volumes)"

      - name: Report results as annotations
        if: always()
        run: |
          tests/ci-annotate.sh "docker build" "${{ steps.build.outcome }}" "$RUNNER_TEMP/build.log"
          tests/ci-annotate.sh "smoke test" "${{ steps.smoke.outcome }}" "$RUNNER_TEMP/smoke.log" '^(PASS|FAIL|RESULT|---)'
          tests/ci-annotate.sh "terminal test, zsh" "${{ steps.ptyzsh.outcome }}" "$RUNNER_TEMP/pty-zsh.log" '^(PASS|FAIL|      |ALL|[0-9]+ SHELL)'
          tests/ci-annotate.sh "terminal test, bash" "${{ steps.ptybash.outcome }}" "$RUNNER_TEMP/pty-bash.log" '^(PASS|FAIL|      |ALL|[0-9]+ SHELL)'
          tests/ci-annotate.sh "importer end to end" "${{ steps.e2e.outcome }}" "$RUNNER_TEMP/e2e.log" '^(PASS|FAIL|RESULT|==|\[setup\]|fake API|PKI|      \|)'
          tests/ci-annotate.sh "setup.ps1 on real Docker" "${{ steps.setup.outcome }}" "$RUNNER_TEMP/setup-real.log" '^(==|  OK|  WARN|  FAIL|All set|DevOps toolbox)'
          tests/ci-annotate.sh "setup.sh on real Docker" "${{ steps.setupsh.outcome }}" "$RUNNER_TEMP/setup-sh-real.log" '^(==|  OK|  WARN|  FAIL|All set|DevOps toolbox)'
          tests/ci-annotate.sh "bash wrappers on real Docker" "${{ steps.setupsh.outcome }}" "$RUNNER_TEMP/bash-real.log" '^(#|tools|Terraform|Client|from stdin|the-folder|\[)'
          tests/ci-annotate.sh "uninstall.sh on real Docker" "${{ steps.uninstallsh.outcome }}" "$RUNNER_TEMP/uninstall-sh-real.log" '^(==|  OK|  WARN|  FAIL|Done|DevOps toolbox|#)'
          tests/ci-annotate.sh "uninstall.ps1 on real Docker" "${{ steps.uninstall.outcome }}" "$RUNNER_TEMP/uninstall-real.log" '^(==|  OK|  WARN|  FAIL|Done|DevOps toolbox|#)'

      - name: Publish results to the job summary
        if: always()
        run: |
          {
            echo '## Smoke test'
            echo '```'
            cat "$RUNNER_TEMP/smoke.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## Terminal test, zsh'
            echo '```'
            cat "$RUNNER_TEMP/pty-zsh.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## Terminal test, bash'
            echo '```'
            cat "$RUNNER_TEMP/pty-bash.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## Importer end to end'
            echo '```'
            cat "$RUNNER_TEMP/e2e.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## setup.ps1 on the real Docker engine'
            echo '```'
            cat "$RUNNER_TEMP/setup-real.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## setup.sh on the real Docker engine'
            echo '```'
            cat "$RUNNER_TEMP/setup-sh-real.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## bash wrappers on the real Docker engine'
            echo '```'
            cat "$RUNNER_TEMP/bash-real.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## uninstall.sh on the real Docker engine'
            echo '```'
            cat "$RUNNER_TEMP/uninstall-sh-real.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## uninstall.ps1 on the real Docker engine'
            echo '```'
            cat "$RUNNER_TEMP/uninstall-real.log" 2>/dev/null || echo 'did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
