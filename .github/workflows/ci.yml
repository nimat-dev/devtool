name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Lint and PowerShell wrapper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        run: |
          curl -fsSLo "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version | sed -n 2p
          shellcheck -s sh scripts/devtools-entrypoint.sh
          shellcheck -s bash scripts/import-docker-desktop-kube.sh tests/smoke.sh tests/e2e-import.sh tests/fakebin/docker

      - name: Compose file renders
        run: docker compose config -q

      - name: PowerShell wrapper tests
        shell: pwsh
        run: ./tests/Test-Devtools.ps1

  image:
    name: Build the image and test it
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        id: build
        run: docker build --progress=plain --tag devtools:ci . 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Smoke test every tool inside the image
        id: smoke
        run: |
          arg() { sed -n "s/^ARG $1=\(.*\)$/\1/p" Dockerfile | head -n 1; }
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            -e EXPECT_KUBECTL="$(arg KUBECTL_VERSION)" \
            -e EXPECT_KUBELOGIN="$(arg KUBELOGIN_VERSION)" \
            -e EXPECT_HELM="$(arg HELM_VERSION)" \
            -e EXPECT_KUSTOMIZE="$(arg KUSTOMIZE_VERSION)" \
            -e EXPECT_FLUX="$(arg FLUX_VERSION)" \
            -e EXPECT_YQ="$(arg YQ_VERSION)" \
            -e EXPECT_GH="$(arg GH_VERSION)" \
            devtools:ci bash /tests/smoke.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"

      - name: Importer end to end (container reaches a fake API on the host)
        id: e2e
        run: tests/e2e-import.sh devtools:ci 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Annotate failures
        if: failure()
        run: |
          annotate() { # annotate TITLE FILE PATTERN
            local msg
            msg=$(grep -E "$3" "$2" | tail -n 25 | cut -c1-220 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::${msg}"
          }
          if [ "${{ steps.build.outcome }}" = failure ]; then annotate "docker build failed" "$RUNNER_TEMP/build.log" '.'; fi
          if [ "${{ steps.smoke.outcome }}" = failure ]; then annotate "smoke test" "$RUNNER_TEMP/smoke.log" '^(FAIL|RESULT)'; fi
          if [ "${{ steps.e2e.outcome }}" = failure ]; then annotate "importer end to end" "$RUNNER_TEMP/e2e.log" '^(FAIL|RESULT|fake API|PKI)'; fi

      - name: Publish results to the job summary
        if: always()
        run: |
          {
            echo '## Smoke test'
            echo '```'
            cat "$RUNNER_TEMP/smoke.log" 2>/dev/null || echo 'did not run'
            echo '```'
            echo '## Importer end to end'
            echo '```'
            cat "$RUNNER_TEMP/e2e.log" 2>/dev/null || echo 'did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
